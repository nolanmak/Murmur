[package]
name = "fotw-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }

# macOS Core Audio process taps. Pinned exactly, not caret: cidre shipped
# 0.16.1 -> 0.17.0 -> 0.19.0 -> 0.20.0 in five weeks. It is MIT and its
# core_audio module is ~2,500 lines, so vendoring is a real fallback if the
# churn becomes intolerable. Chosen over objc2-core-audio for RAII teardown:
# TapGuard/AggregateDevice/StartedDevice destroy in the correct order on drop,
# and leaked private aggregate devices are the failure that surfaces in week 6.
[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "=0.20.0", default-features = false, features = [
  "core_audio", "at", "av", "cm", "cat", "cf", "ns", "objc", "blocks", "dispatch",
  "macos_14_4",
] }
