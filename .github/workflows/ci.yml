name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'macOS'
        run: brew install gitleaks && gitleaks git --redact --no-banner .
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev python3-gi gir1.2-gtk-3.0 xvfb pipewire-bin libspa-0.2-modules
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/check-repo.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/test-linux-ui.py
      - if: runner.os == 'Linux'
        run: python3 scripts/test-linux-native.py
