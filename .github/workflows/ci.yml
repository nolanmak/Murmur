name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'macOS'
        run: brew install gitleaks && gitleaks git --redact --no-banner .
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/check-repo.py
      - name: Test managed local Whisper lifecycle
        run: python3 -m unittest discover -s scripts -p 'test_local_whisper.py'
      - if: runner.os == 'macOS'
        name: Build installable Mac preview
        run: |
          ./scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent Murmur.app Murmur-macOS-preview.zip
          shasum -a 256 Murmur-macOS-preview.zip > Murmur-macOS-preview.zip.sha256
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-macOS-preview
          path: |
            Murmur-macOS-preview.zip
            Murmur-macOS-preview.zip.sha256
          retention-days: 14
