name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - if: runner.os == 'macOS'
        run: brew install gitleaks && gitleaks git --redact --no-banner .
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked --example cleanup_eval
      - run: python3 scripts/check-repo.py
      - name: Test managed local Whisper lifecycle
        run: python3 -m unittest discover -s scripts -p 'test_local_whisper.py'
      - if: runner.os == 'macOS'
        name: Test owned native vocabulary dialogs
        run: |
          cargo build --locked --example vocabulary_native_qa
          python3 - <<'PY'
          import os, subprocess
          output = os.path.join(os.environ["RUNNER_TEMP"], "native-vocabulary-fixture")
          subprocess.run(["target/debug/examples/vocabulary_native_qa", output], check=True, timeout=40)
          PY
      - if: runner.os == 'macOS'
        name: Test owned cleanup and privacy menu actions
        run: |
          cargo build --locked --example cleanup_menu_qa
          python3 - <<'PYTHON'
          import os, subprocess
          output = os.path.join(os.environ["RUNNER_TEMP"], "native-cleanup-menu-fixture")
          subprocess.run(["target/debug/examples/cleanup_menu_qa", output], check=True, timeout=20)
          PYTHON
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-vocabulary-fixtures
          path: ${{ runner.temp }}/native-vocabulary-fixture
          retention-days: 14
      - if: runner.os == 'macOS'
        name: Build installable Mac preview
        run: |
          ./scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent Murmur.app Murmur-macOS-preview.zip
          shasum -a 256 Murmur-macOS-preview.zip > Murmur-macOS-preview.zip.sha256
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Murmur-macOS-preview
          path: |
            Murmur-macOS-preview.zip
            Murmur-macOS-preview.zip.sha256
          retention-days: 14
