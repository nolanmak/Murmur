[workspace]
resolver = "3"
members = ["."]
default-members = ["."]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nolanmak/Murmur"
[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
[package]
name = "murmur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "native-tls"] }
tempfile = "3"
fotw-audio = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f" }
fotw-stt = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f" }
fotw-secrets = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fotw-dsp = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f" }
rtrb = "0.3"
dotenvy = "0.15"
futures-util = { workspace = true, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication", "NSPanel", "NSTextField", "NSScreen", "NSFont", "NSFontDescriptor", "NSColor", "NSBox", "NSView", "NSControl", "NSParagraphStyle", "NSLayoutConstraint"] }
tray-icon = { version = "0.24", default-features = false }
muda = { version = "0.19", default-features = false }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
fotw-dsp = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f", features = ["conformance"] }
fotw-stt = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f", features = ["conformance"] }
fotw-audio = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f", features = ["conformance"] }
fotw-secrets = { git = "https://github.com/nolanmak/FlyOnTheWall", rev = "0f144bb2aa3fc23c81d167bb27d9c58875e4419f", features = ["conformance"] }
futures-util = { workspace = true, features = ["sink", "std"] }
tokio-tungstenite = "0.29"
[profile.release]
lto = "thin"
codegen-units = 1
[[test]]
name = "macos_clipboard"
harness = false

[[test]]
name = "local_pasteboard"
harness = false
