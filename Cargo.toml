[workspace]
resolver = "3"
members = [".", "vendor/fotw-audio", "vendor/fotw-stt", "vendor/fotw-secrets"]
default-members = ["."]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nolanmak/Text-to-speech"
[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
[package]
name = "text-to-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
fotw-audio = { path = "vendor/fotw-audio" }
fotw-stt = { path = "vendor/fotw-stt" }
fotw-secrets = { path = "vendor/fotw-secrets" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rubato = "5.0.0"
rtrb = "0.3"
dotenvy = "0.15"
futures-util = { workspace = true, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication", "NSPanel", "NSTextField", "NSScreen", "NSFont", "NSColor"] }
tray-icon = { version = "0.24", default-features = false }
muda = { version = "0.19", default-features = false }
[dev-dependencies]
tempfile = "3"
futures-util = { workspace = true, features = ["sink", "std"] }
tokio-tungstenite = "0.29"
[profile.release]
lto = "thin"
codegen-units = 1
